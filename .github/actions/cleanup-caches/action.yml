name: Clean up caches
description: Prune uv and remove pytools persistent caches

runs:
  using: composite
  steps:
    - name: Prune uv cache
      shell: bash
      run: |
        if command -v uv >/dev/null 2>&1; then
          uv cache prune --ci
        fi

    - name: Clean pytools persistent caches
      shell: bash
      run: |
        if [[ ! -x .venv/bin/python ]]; then
          echo "No virtual environment available"
          exit 0
        fi

        PYTOOLS_CACHE_DIR=$(
          .venv/bin/python -c \
            'import platformdirs; print(platformdirs.user_cache_dir("pytools","pytools"))'
        ) || exit 1

        if [[ -n "$PYTOOLS_CACHE_DIR" ]]; then
          echo "Cleaning pytools persistent dicts from $PYTOOLS_CACHE_DIR"
          rm -rf --preserve-root=all -- "$PYTOOLS_CACHE_DIR"
        else
          echo "PYTOOLS_CACHE_DIR could not be determined"
        fi
