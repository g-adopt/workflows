name: Install system dependencies
description: Install common G-ADOPT system dependencies

inputs:
  extra-packages:
    description: Additional APT packages to install
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install APT packages
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        apt update
        apt install -y \
            git-lfs gmsh patchelf proj-bin unzip \
            libboost-dev libboost-program-options-dev libboost-python-dev libboost-thread-dev \
            libcgal-dev libgdal-dev libproj-dev \
            libgl1-mesa-dev libglew-dev libglu1-mesa-dev \
            libqt5opengl5-dev libqt5svg5-dev libqt5xmlpatterns5-dev libqwt-qt5-dev \
            zlib1g-dev \
            $EXTRA_PACKAGES

    - name: Configure Git safe directory
      shell: bash
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
