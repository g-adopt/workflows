name: G-ADOPT main CI

on:
  workflow_call:
    inputs:
      target_container:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Benchmark regression test
    runs-on:
      group: "Main CI"
    container:
      # Prefer specific branch, then PR label, then actual branch
      # Default to dev-main
      image: >-
        firedrakeproject/firedrake-vanilla-default:${{
          inputs.target_container ||
          case(
            github.event_name == 'pull_request' &&
              contains(github.event.pull_request.labels.*.name, 'container:main'),
            'dev-main',
            github.event_name == 'pull_request' &&
              contains(github.event.pull_request.labels.*.name, 'container:release'),
            'dev-release',
            github.base_ref == 'release' || github.ref_name == 'release',
            'dev-release',
            'dev-main'
          )
        }}
      options: --cap-add SYS_NICE --shm-size=1024m

    concurrency:
      group: testing-${{ github.event.pull_request.number|| github.run_id }}
      cancel-in-progress: true

    env:
      OMP_NUM_THREADS: 1
      UV_EXCLUDE: ${{ github.workspace}}/.uv-exclude.txt

    steps:
      - name: Install prerequisites
        uses: $/.github/actions/install-system-dependencies
        with:
          extra-packages: >-
            time gcc cmake libsqlite3-dev libhwloc-dev libgtest-dev

      - name: Fix OpenMPI installation
        run: |
            # Remove block on files in /usr/share/doc being installed
            rm /etc/dpkg/dpkg.cfg.d/excludes
            apt reinstall libprrte-dev
            for i in /usr/share/doc/libprrte-dev/*; do
              [[ ${i#*\.} == "txt.gz" ]] && gunzip $i
            done
            ln -s /usr/share/doc/libprrte-dev /usr/lib/x86_64-linux-gnu/prrte3/share/prte
        shell: bash

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - uses: actions/checkout@v5
        with:
          lfs: true
          persist-credentials: false

      - name: Fetch LFS artifacts
        run: |
          git lfs checkout

      - name: Fetch task spooler
        uses: actions/checkout@v5
        with:
          repository: dsroberts/tsp_for_hpc
          path: ./tsp
          ref: ${{ vars.TSP_VERSION }}
          persist-credentials: false

      - name: Build task spooler
        run: |
          cmake ./tsp -B ./tsp_build
          cmake --build ./tsp_build
          mv ./tsp_build/tsp-hpc /usr/local/bin/tsp

      - name: Install Python dependencies
        run: |
          uv venv --system-site-packages
          uv pip install 'pygplates @ git+https://github.com/dsroberts/GPlates.git@PyGPlates-1.0.0'
          uv pip install .[demos,optimisation,gplates]

      - name: Check out repository linked to Trim et al. (2023)
        uses: actions/checkout@v5
        with:
          repository: seantrim/exact-thermochem-solution
          path: ./flib
          persist-credentials: false

      - name: Compile flib (Trim et al., 2023)
        run: |
          source .venv/bin/activate
          uv pip install meson
          cd flib/Python
          rm *.so
          sed -i 's/f2py3/f2py/' create_library.sh
          source create_library.sh
          cp *.so ../../tests/multi_material
        shell: bash

      - name: Run test
        id: run_tests
        run: |
          firedrake-clean
          tsp --timeout -T 9000
          tsp --memprof
          . .venv/bin/activate
          doit run --process $(nproc --all) --continue --always-execute run_case || true
        env:
          GADOPT_LOGLEVEL: INFO

      - name: Pytest
        id: run_pytest
        run: |
          . .venv/bin/activate
          python -m pytest -m 'not longtest' --junit-xml=test_results.xml

      - name: Pytest report
        uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() && steps.run_pytest.conclusion != 'skipped' }}
        with:
          check_name: Test suite report
          report_paths: test_results.xml
          include_passed: true
          annotate_only: true

      - name: Output timing information
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          tsp --gh-summary >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: run-log
          path: /tmp/tsp_db.sqlite3

      - name: Cleanup temporary files
        if: always()
        shell: bash
        run: |
          uv cache prune --ci
          # see https://github.com/inducer/pytools/blob/main/pytools/persistent_dict.py#L484
          export PYTOOLS_CACHE_DIR=$(
            .venv/bin/python -c \
              'import platformdirs; print(platformdirs.user_cache_dir("pytools","pytools"))'
          )
          if [[ "${PYTOOLS_CACHE_DIR}" ]]; then
            echo Cleaning pytools persistent dicts from "${PYTOOLS_CACHE_DIR}"
            rm -rf --preserve-root=all "${PYTOOLS_CACHE_DIR}"
          else
            echo PYTOOLS_CACHE_DIR could not be determined
          fi
