name: G-ADOPT tutorial render

on:
  workflow_call:
    inputs:
      target_container:
        type: string
        required: false
        default: ""
      trigger:
        type: boolean
        default: false
    secrets:
      DISPATCH_TOKEN:
        required: true

jobs:
  render:
    runs-on:
      group: "Main CI"
    container:
      image: firedrakeproject/firedrake-vanilla-default:${{ inputs.target_container || 'dev-main' }}
      options: --cap-add=SYS_ADMIN

    permissions:
      contents: read

    env:
      OMP_NUM_THREADS: 1
      UV_EXCLUDE: ${{ github.workspace }}/.uv-exclude.txt

    steps:
      - name: Install prerequisites
        uses: $/.github/actions/install-system-dependencies
        with:
          extra-packages: gh iproute2 uidmap xvfb

      - uses: actions/checkout@v5.1.0
        with:
          lfs: true
          persist-credentials: false

      - name: Add adaptivity to Firedrake
        run: |
          cd /opt/petsc
          python3 /opt/firedrake/scripts/firedrake-configure \
            --arch default --show-petsc-configure-options | \
            xargs -L1 ./configure --with-make-np=8 --download-slepc \
            --download-mmg --download-mmg-cmake-arguments=-DUSE_SCOTCH=OFF \
            --download-eigen --download-parmmg
          make PETSC_DIR=/opt/petsc PETSC_ARCH=arch-firedrake-default all

      - name: Fetch LFS artifacts
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          git lfs checkout

      - name: Set up Python environment
        uses: $/.github/actions/setup-python-environment
        with:
          extras: demos,optimisation
          extra-packages: nbval nbconvert jupytext siphash24

      - name: Install Animate
        run: |
          uv cache clean animate
          uv pip install --no-build-isolation \
            git+https://github.com/mesh-adaptation/animate

      - name: Get Muller et al 2022 plate reconstructions
        run: |
          curl -fsSLO https://data.gadopt.org/github-actions/Muller_etal_2022_SE_1Ga_Opt_PlateMotionModel_v1.2.zip
          unzip Muller_etal_2022_SE_1Ga_Opt_PlateMotionModel_v1.2.zip -d demos/mantle_convection/gplates_global

      - name: Install Firedrake kernel
        run: |
          . .venv/bin/activate
          python3 -m ipykernel install --name firedrake --user

      - name: Set up for network namespacing
        run: |
          . .venv/bin/activate
          nbconvert_location="$(which jupyter-nbconvert)"
          cp .testing/jupyter-nbconvert "$nbconvert_location"
          chmod +x "$nbconvert_location"

      - name: Convert notebooks
        run: |
          . .venv/bin/activate
          export DISPLAY=:99
          export PYVISTA_OFF_SCREEN=true
          export LIBGL_ALWAYS_SOFTWARE=true
          export GADOPT_RENDER=true
          Xvfb $DISPLAY -screen 0 1024x768x24 > /dev/null 2>&1 &
          sleep 3
          doit run --process $(nproc --all) --always-execute convert
          rm -rf rendered && mkdir rendered
          tar -xf artifact.tar -C rendered
        env:
          GADOPT_LOGLEVEL: WARN
      - uses: actions/upload-artifact@v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: notebooks
          path: rendered
          include-hidden-files: true
          if-no-files-found: error

      - name: Cleanup caches
        if: always()
        uses: $/.github/actions/cleanup-caches

  dispatch:
    name: Trigger documentation build
    needs: render
    runs-on: ubuntu-latest
    permissions: {}
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.trigger)
    steps:
      - name: Dispatch documentation build
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          gh api --method POST \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          /repos/g-adopt/g-adopt.github.io/dispatches \
          -f "event_type=doc-rebuild" -F "client_payload[run_id]=${{ github.run_id }}"
